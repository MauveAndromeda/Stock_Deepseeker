[build-system]
requires = ["setuptools>=68.0,<70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-deepseeker"
version = "3.0.0"
description = "Quantitative trading research platform for academic and personal research purposes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Stock Deepseeker Team", email = "team@stockdeepseeker.com"}
]
keywords = [
    "quantitative-research",
    "algorithmic-trading-research",
    "backtesting",
    "alpha-research",
    "research-platform"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Education",
    "Typing :: Typed"
]

dependencies = [
    # Core dependencies
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "typing-extensions>=4.8.0",

    # Data Science
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "hmmlearn>=0.3.0",  # Hidden Markov Models for regime detection

    # Financial Data
    "yfinance>=0.2.40",  # >=0.2.40 fixes f-string syntax error in Python 3.11+
    "pandas-market-calendars>=4.3.0",
    "exchange-calendars>=4.5.0",
    "alpaca-py>=0.8.0",  # Alpaca trading API
    "polygon-api-client>=1.12.0",  # Polygon.io data API
    "lxml>=4.9.0",  # Required by yfinance for HTML parsing
    "charset-normalizer>=3.0.0",  # Required by requests for encoding detection
    "requests>=2.31.0",  # HTTP library

    # Database
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "peewee>=3.17.0",

    # API and Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiohttp>=3.9.0",  # Lower version for Python 3.13+ compatibility
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",

    # Task Scheduling
    "apscheduler>=3.10.4",

    # Monitoring and Logging
    "prometheus-client>=0.20.0",
    "python-json-logger>=2.0.7",

    # Utils
    "click>=8.1.7",
    "rich>=13.7.0",
    "tqdm>=4.66.0",

    # LangChain/LangGraph for multi-agent systems (core feature)
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.0",

    # AI API Clients (core feature)
    "openai>=1.0.0",
    "anthropic>=0.18.0",

    # Async Support
    "nest-asyncio>=1.6.0",
]

[project.optional-dependencies]
# AI and ML dependencies (heavy)
ai = [
    "google-generativeai>=0.7.0",
    "transformers>=4.44.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
]

# Reinforcement Learning
rl = [
    "stable-baselines3>=2.3.0",
    "gymnasium>=0.29.0",
    "tensorboard>=2.17.0",
]

# Visualization
viz = [
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
    "seaborn>=0.13.0",
    "dash>=2.17.0",
]

# Technical Analysis (optional - requires system dependencies)
ta = [
    "ta-lib>=0.4.28",  # Requires C library: apt-get install ta-lib
    "pandas-ta>=0.3.14b",  # Pure Python alternative
]

# Development dependencies
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.3.0",
    "pytest-benchmark>=4.0.0",

    # Code Quality
    "ruff>=0.5.0",
    "black>=24.4.0",
    "isort>=5.13.0",
    "mypy>=1.11.0",
    "pylint>=3.2.0",

    # Type Stubs
    "pandas-stubs>=2.2.0",
    "types-pyyaml>=6.0.12",
    "types-redis>=4.6.0",

    # Pre-commit
    "pre-commit>=3.7.0",

    # Documentation
    "sphinx>=7.3.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=2.2.0",
    "myst-parser>=3.0.0",

    # Testing Tools
    "faker>=25.0.0",
    "freezegun>=1.5.0",
    "responses>=0.25.0",

    # Security
    "bandit>=1.7.0",
    "safety>=3.0.0",
]

# Production dependencies (optimized for deployment)
prod = [
    "gunicorn>=22.0.0",
    "gevent>=24.2.0",
]

# All optional dependencies
all = [
    "stock-deepseeker[ai,rl,viz,ta,dev,prod]",
]

[project.urls]
Homepage = "https://github.com/MauveAndromeda/Stock_Deepseeker"
Documentation = "https://stock-deepseeker.readthedocs.io"
Repository = "https://github.com/MauveAndromeda/Stock_Deepseeker"
Issues = "https://github.com/MauveAndromeda/Stock_Deepseeker/issues"
Changelog = "https://github.com/MauveAndromeda/Stock_Deepseeker/blob/main/CHANGELOG.md"

[project.scripts]
stock-deepseeker = "src.cli:main"
deepseeker-backtest = "src.cli.backtest:main"
deepseeker-optimize = "src.cli.optimize:main"
deepseeker-serve = "src.cli.serve:main"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["py.typed", "**/*.yaml", "**/*.json"]

# Ruff configuration (replaces flake8, isort, pyupgrade, etc.)
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "ANN",    # flake8-annotations
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "EXE",    # flake8-executable
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "G",      # flake8-logging-format
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # pylint
    "TRY",    # tryceratops
    "RUF",    # ruff-specific rules
]
ignore = [
    # Type annotations (too strict for research code)
    "ANN001",  # Missing type annotation for function argument
    "ANN002",  # Missing type annotation for *args
    "ANN003",  # Missing type annotation for **kwargs
    "ANN201",  # Missing return type annotation for public function
    "ANN202",  # Missing return type annotation for private function
    "ANN204",  # Missing return type annotation for special method
    "ANN401",  # Dynamically typed expressions (Any)

    # Complexity (allow complex algorithms)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "PLR0911", # Too many return statements

    # Style (conflicts with formatters or too strict)
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "ISC001",  # Implicit string concatenation (conflicts with formatter)
    "E501",    # Line too long (handled by black)
    "W293",    # Blank line contains whitespace

    # Datetime (allow naive datetime for simplicity)
    "DTZ005",  # datetime.now() without timezone
    "DTZ006",  # datetime.fromtimestamp() without timezone

    # Logging (allow f-strings in logging)
    "G004",    # Logging with f-string

    # Error messages (allow inline strings)
    "EM101",   # Exception must not use a string literal
    "EM102",   # Exception must not use an f-string literal
    "TRY003",  # Avoid specifying long messages outside exception class
    "TRY004",  # Prefer TypeError for invalid type
    "TRY300",  # Consider moving this statement to an else block
    "TRY400",  # Use logging.exception instead of logging.error

    # Naming (allow research naming conventions)
    "N805",    # First argument of a method should be named self
    "N806",    # Variable in function should be lowercase
    "N812",    # Lowercase imported as non-lowercase (e.g., F for functional)

    # Misc
    "RUF001",  # Ambiguous unicode character
    "RUF002",  # Ambiguous unicode character (allow Chinese comments)
    "RUF003",  # Ambiguous unicode character (allow Chinese comments)
    "RUF006",  # Store a reference to the return value of asyncio.create_task
    "RUF012",  # Mutable class attributes should be annotated with ClassVar
    "RUF013",  # PEP 484 prohibits implicit Optional
    "RUF022",  # __all__ is not sorted (allow manual organization)
    "F401",    # Module imported but unused
    "F403",    # import * used (legacy code compatibility)
    "F405",    # Name may be undefined, or defined from star imports
    "F841",    # Local variable is assigned but never used
    "PLC0206", # Extracting value from dictionary without calling .items()
    "PLC0415", # import not at top-level (needed for async code)
    "S101",    # Use of assert
    "S104",    # Binding to all interfaces (development servers)
    "S110",    # try-except-pass detected
    "S112",    # try-except-continue detected
    "S301",    # Pickle usage (data serialization)
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
    "S324",    # Insecure hash functions (MD5 for cache keys, not security)
    "B006",    # Do not use mutable data structures for argument defaults
    "B007",    # Loop control variable not used within the loop body
    "B027",    # Empty method in abstract base class
    "B904",    # raise without from inside except
    "B905",    # zip without explicit strict parameter
    "RET504",  # Unnecessary variable assignment before return
    "ERA001",  # Commented out code
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument
    "A001",    # Variable is shadowing a Python builtin
    "A002",    # Argument is shadowing a Python builtin
    "E402",    # Module level import not at top of file (path manipulation)
    "E722",    # Bare except (some legacy code)
    "SIM117",  # Use single with statement (preference)
    "PTH103",  # os.makedirs() vs Path.mkdir() (compatibility)
    "PTH110",  # os.path.exists() vs Path.exists() (compatibility)
    "PTH204",  # os.path.getmtime vs Path.stat() (compatibility)
    "SLF001",  # Private member access (needed in tests)
    "PT017",   # Assert on exception in except block (test patterns)
    "N803",    # Argument name should be lowercase
    "PTH123",  # Use Path.open instead of open
    "SIM102",  # Use a single if instead of nested if
    "SIM108",  # Use ternary operator instead of if-else
    "SIM118",  # Use key in dict instead of key in dict.keys()
    "DTZ001",  # datetime() without timezone
    "DTZ003",  # datetime.utcnow() without timezone
    "DTZ007",  # datetime.strptime() without timezone
    "W291",    # Trailing whitespace
    "TRY002",  # Create your own exception
    "TRY301",  # Abstract raise to an inner function
    "PLW0603", # Using the global statement
    "PLW2901", # Outer for loop variable overwritten by inner assignment
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "PLR2004"]
"scripts/**/*.py" = ["T201", "S603", "S607"]
"一键回测脚本.py" = ["T201", "S603", "S607", "ANN", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-sort-within-sections = true
combine-as-imports = true

# Black configuration
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | \.pytest_cache
  | \.mypy_cache
  | build
  | dist
)/
'''

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_concatenate = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "ta.*",
    "pandas_ta.*",
    "sklearn.*",
    "transformers.*",
    "torch.*",
    "stable_baselines3.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--color=yes",
    "--tb=short",
    "--maxfail=10",
    "-ra",
    "--durations=10",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "requires_api: marks tests that require API keys",
    "requires_network: marks tests that require network access",
    "requires_gpu: marks tests that require GPU",
    "benchmark: marks tests as performance benchmarks",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@overload",
]

[tool.coverage.html]
directory = "htmlcov"

# Pylint configuration
[tool.pylint.main]
py-version = "3.10"
jobs = 0  # Use all available CPUs

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "W0212",  # protected-access
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-locals = 20
max-branches = 15
max-statements = 60
